[package]
name = "hearth-ui"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "hearth_ui"
path = "src/lib.rs"

[[bin]]
name = "shots"
path = "src/bin/shots.rs"

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
png = "0.17"

[build-dependencies]
slint-build = "1.19"
