[package]
name = "hearth-desktop"
version.workspace = true
edition.workspace = true
publish = false
description = "Hearth for Windows and Linux: Slint window, tray, notifications, the relay inside"

[[bin]]
name = "hearth"
path = "src/main.rs"

[lib]
name = "hearth_desktop"
path = "src/lib.rs"

[dependencies]
hearth-relay = { path = "../../desktop/relay-rs" }
hearth-client = { path = "../client" }
hearth-ui = { path = "../ui" }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "backend-winit-wayland", "backend-winit-x11", "renderer-software", "software-renderer-systemfonts", "unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
regex = "1"
url = "2"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
rfd = "0.17"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25"
tauri-winrt-notification = "0.7"

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
png = "0.17"
tempfile = "3"
