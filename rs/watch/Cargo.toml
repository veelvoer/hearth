[package]
name = "hearth-watch"
version.workspace = true
edition.workspace = true
publish = false
build = "build.rs"

[lib]
name = "hearth_watch"
crate-type = ["cdylib", "rlib"]

[dependencies]
hearth-android = { path = "../phone/glue" }
hearth-client = { path = "../client" }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "renderer-software", "backend-android-activity-06"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }

[build-dependencies]
slint-build = "1.19"
