[package]
name = "hearth-phone"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "hearth_phone"
crate-type = ["cdylib", "rlib"]

[dependencies]
hearth-android = { path = "glue" }
hearth-client = { path = "../client" }
hearth-ui = { path = "../ui" }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
hearth-relay = { path = "../../desktop/relay-rs" }

# The Android-only parts: on a desktop host this crate is empty so `cargo build` in rs/ keeps working.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "renderer-software", "backend-android-activity-06"] }
