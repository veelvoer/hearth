name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version inside the app, the server and the phone app
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ -s "release-notes/$V.md" ] || { echo "release-notes/$V.md is missing: every release needs notes"; exit 1; }
          ! grep -q "TODO" "release-notes/$V.md" || { echo "release-notes/$V.md still says TODO"; exit 1; }
          [ "$(node -p "require('./desktop/package.json').version")" = "$V" ] || { echo "desktop/package.json is not $V"; exit 1; }
          [ "$(node -p "require('./desktop/relay/version.js')")" = "$V" ] || { echo "desktop/relay/version.js is not $V"; exit 1; }
          grep -q "^version = \"$V\"" desktop/relay-rs/Cargo.toml || { echo "desktop/relay-rs/Cargo.toml is not $V"; exit 1; }
          grep -q "versionName = \"$V\"" app/build.gradle.kts || { echo "app/build.gradle.kts is not $V"; exit 1; }
  desktop:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The fast Rust reader of the chat logs goes into the app (Linux, a static program that runs everywhere)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq musl-tools >/dev/null
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --manifest-path desktop/relay-rs/Cargo.toml --target x86_64-unknown-linux-musl
          cp desktop/relay-rs/target/x86_64-unknown-linux-musl/release/hearth-relay desktop/bin/
      - name: The fast Rust reader of the chat logs goes into the app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --manifest-path desktop/relay-rs/Cargo.toml
          cp desktop/relay-rs/target/release/hearth-relay.exe desktop/bin/
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
  relay-front:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static binary for Linux x64 (it runs on any distribution, on a server or a laptop)
        run: |
          sudo apt-get install -y -qq musl-tools >/dev/null
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --manifest-path desktop/relay-rs/Cargo.toml --target x86_64-unknown-linux-musl
          mkdir out
          cp desktop/relay-rs/target/x86_64-unknown-linux-musl/release/hearth-relay out/hearth-relay-linux-x64
      - name: Static binary for Linux arm64 (a server on a Raspberry Pi or an Ampere cloud machine; skipped if it does not build)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu >/dev/null
          rustup target add aarch64-unknown-linux-musl
          CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc cargo build --release --manifest-path desktop/relay-rs/Cargo.toml --target aarch64-unknown-linux-musl
          cp desktop/relay-rs/target/aarch64-unknown-linux-musl/release/hearth-relay out/hearth-relay-linux-arm64
      - name: Checksums
        run: cd out && sha256sum hearth-relay-linux-* > hearth-relay.sha256
      - uses: actions/upload-artifact@v4
        with: { name: relay-front, path: out/* }
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Restore signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$RUNNER_TEMP/release.jks" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "hearth" "${{ secrets.ANDROID_KEY_PASSWORD }}" > "$RUNNER_TEMP/keys.properties"
      - run: ./gradlew :app:assembleRelease :wear:assembleRelease
        env:
          CM_KEYSTORE_PROPS: ${{ runner.temp }}/keys.properties
      - name: Name the file
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Hearth-${GITHUB_REF_NAME#v}.apk"
          # the watch app goes out zipped: older phone apps take any .apk of a release as their own update
          cp wear/build/outputs/apk/release/wear-release.apk "Hearth-watch-${GITHUB_REF_NAME#v}.apk" && zip -q "Hearth-watch-${GITHUB_REF_NAME#v}.zip" "Hearth-watch-${GITHUB_REF_NAME#v}.apk" && rm "Hearth-watch-${GITHUB_REF_NAME#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Hearth-*.apk
            Hearth-watch-*.zip
  publish:
    needs: [desktop, android, relay-front]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: The notes of this version become the text of the release
        run: cp "release-notes/${GITHUB_REF_NAME#v}.md" NOTES.md
      - uses: softprops/action-gh-release@v2
        with: { files: out/*, body_path: NOTES.md }
