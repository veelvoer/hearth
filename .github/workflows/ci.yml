name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: for f in desktop/*.js desktop/relay/*.js desktop/renderer/*.js server/*.js support/*.js; do node --check "$f"; done
      - name: Support desk test
        run: node support/test/support.test.js
      - name: Several computers test
        run: node desktop/test/computers.test.js
      - name: Ask-to-connect test
        run: node desktop/test/pair.test.js
      - name: Permissions and root test
        run: node desktop/test/perms-flow.test.js
      - name: Odd chat files test
        run: node desktop/test/odd-chats.test.js
      - name: Support mail test
        run: node desktop/test/support-mail.test.js
      - name: Workflow test
        run: node desktop/test/workflow.test.js
      - name: Week pins test
        run: node desktop/test/weekpins.test.js
      - name: API keys test
        run: node desktop/test/apikeys.test.js
      - name: Page scripts test
        run: node desktop/test/globals.test.js
      - name: MCP kit test
        run: node desktop/test/mcpkit.test.js
      - name: Root-owned files test
        run: node desktop/test/rootfiles.test.js
      - name: Screens use only names that exist
        run: node scripts/lint-renderer.js
      - name: Safety test (snapshots, backups, secrets)
        run: node desktop/test/safety.test.js
      - name: Safety through the server
        run: node desktop/test/safety-server.test.js
      - name: Rules and decisions test
        run: node desktop/test/rules.test.js
      - name: Extras test (recap, templates, project summary)
        run: node desktop/test/extras.test.js
      - name: Checklist test
        run: node desktop/test/checklist.test.js
      - name: Delete chats test
        run: node desktop/test/delete-chats.test.js
      - name: Login error test
        run: node desktop/test/auth-error.test.js
      - name: Watchdog test
        run: node desktop/test/watchdog.test.js
      - name: Contrast test
        run: node desktop/test/contrast.test.js
      - name: App installer tests
        run: node desktop/test/installer.test.js && node desktop/test/updater-flow.test.js && node desktop/test/packaging.test.js
      - name: Usage limit continue
        run: node desktop/test/limit.test.js
      - name: Command rules test
        run: node desktop/test/perms.test.js
      - name: Shared chats test
        run: node desktop/test/shares.test.js
      - name: Stop button test
        run: node desktop/test/stop.test.js
      - name: Server memory test
        run: node desktop/test/memory.test.js
      - name: Week plan test
        run: node desktop/test/weekplan.test.js
      - name: Chat and file sync test
        run: node desktop/test/sync.test.js
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build the phone app
        run: ./gradlew :app:assembleDebug -q
      - name: Keep the test build
        uses: actions/upload-artifact@v4
        with: { name: phone-debug, path: app/build/outputs/apk/debug/*.apk, retention-days: 3 }
