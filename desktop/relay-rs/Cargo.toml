[package]
name = "hearth-relay"
version = "1.36.0"
edition = "2021"
description = "Hearth relay front: the fast Rust part, in front of the Node relay it is replacing one route at a time"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
memchr = "2"
rayon = "1"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
