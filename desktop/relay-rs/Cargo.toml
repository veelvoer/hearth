[package]
name = "hearth-relay"
version = "1.42.0"
edition = "2021"
description = "The Hearth relay: lists Claude Code chats, runs them, and tells your phone and computer when Claude needs you"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
memchr = "2"
rayon = "1"
getrandom = "0.3"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
tokio-stream = "0.1"
bytes = "1"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
