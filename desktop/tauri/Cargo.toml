[package]
name = "hearth"
version = "1.45.3"
edition = "2021"
description = "Hearth: Claude Code on your phone and computer"

[dependencies]
hearth-relay = { path = "../relay-rs" }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
regex = "1"
url = "2"
bytes = "1"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package.hearth-relay]
opt-level = 3
